# Include this file inside the HTTPS storefront server block.
# Compress text responses, including JSON proxied from the Node API.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;

# HTML and API routes remain controlled by their own response headers.
# Versioned static files stay in the browser cache between page transitions.
location ~* \.(?:css|js|svg|webp|png|jpe?g|gif|ico|woff2?)$ {
  expires 30d;
  add_header Cache-Control "public";
  try_files $uri =404;
}
