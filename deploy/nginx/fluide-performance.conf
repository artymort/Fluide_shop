# Loaded from /etc/nginx/conf.d inside the http context.
# Compress text responses, including JSON proxied from the Node API.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;

# HTML remains revalidated; versioned static files stay in the browser cache.
map $sent_http_content_type $fluide_expires {
  default                         off;
  text/html                       epoch;
  text/css                        7d;
  application/javascript         7d;
  ~image/                         30d;
  font/woff2                      30d;
}

expires $fluide_expires;
