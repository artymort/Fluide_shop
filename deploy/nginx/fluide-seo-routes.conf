# Include inside the existing fluide-atelier.ru HTTPS server block.
# Keep the existing /api/ proxy, static-file, certificate and payment configuration.
# Do not include in a generic/default server block.

location = /product.html {
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_pass http://127.0.0.1:3000;
}

location = /catalog.html {
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://127.0.0.1:3000;
}

location = /catalog/ {
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://127.0.0.1:3000;
}

location = /catalog {
  return 301 https://fluide-atelier.ru/catalog/$is_args$args;
}

location ~ ^/catalog/(?:perfume|solid|home|care|car)/?$ {
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://127.0.0.1:3000;
}

location ~ ^/catalog/[^/]+/[^/]+/?$ {
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://127.0.0.1:3000;
}

location = /sitemap.xml {
  proxy_set_header Host $host;
  proxy_pass http://127.0.0.1:3000;
}
